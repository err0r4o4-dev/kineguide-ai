name: kineguide-ai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kineguide}
      POSTGRES_USER: ${POSTGRES_USER:-kineguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/seeds:/seeds:ro
    networks: [app-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  ai-python:
    build:
      context: .
      dockerfile: services/ai-python/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      AI_PORT: 8001
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ALLOWED_HOSTS: '["localhost","127.0.0.1","ai-python"]'
    expose: ["8001"]
    networks: [app-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 384m

  api-go:
    build:
      context: .
      dockerfile: services/api-go/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-kineguide}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-kineguide}?sslmode=disable
      AI_SERVICE_URL: http://ai-python:8001
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080,http://localhost}
      REQUEST_TIMEOUT: 10s
      SHUTDOWN_TIMEOUT: 10s
    ports:
      - "${API_PORT:-8080}:8080"
    networks: [app-internal]
    depends_on:
      postgres:
        condition: service_healthy
      ai-python:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    networks: [app-internal]
    depends_on:
      api-go:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [app-internal]
    depends_on:
      web:
        condition: service_healthy
      api-go:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    volumes:
      - ./database/migrations:/migrations:ro
    networks: [app-internal]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kineguide}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-kineguide}?sslmode=disable

networks:
  app-internal:
    driver: bridge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
