root = "."
tmp_dir = "/tmp/air"

[build]
cmd = "go build -p=2 -o /tmp/air/api ./cmd/server"
entrypoint = ["/tmp/air/api"]
include_ext = ["go"]
include_dir = ["cmd", "db", "internal"]
exclude_dir = ["tmp", "vendor"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
poll = true
poll_interval = 500
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 500000000

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
